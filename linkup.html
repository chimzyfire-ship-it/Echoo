<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050505" />
    <title>Link up · echoo</title>
    <link rel="stylesheet" href="assets/echoo-place-detail.css" />
    <link rel="stylesheet" href="assets/echoo-linkup.css" />
    <link rel="stylesheet" href="assets/page-loader.css" />
    <style>
      :root {
        color-scheme: dark;
        --bg-black: #050505;
        --ink: #f8f5ef;
        --muted: #9e978e;
        --peach: #f7d5b2;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        max-width: 100%;
        background-color: var(--bg-black);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
      }
      body {
        display: flex;
        justify-content: center;
      }
      .app-shell {
        width: min(100%, 430px);
        max-width: 100%;
        min-height: 100svh;
        isolation: isolate;
        position: relative;
        background:
          radial-gradient(circle at 50% -2%, rgba(247, 213, 178, 0.12), transparent 22rem),
          radial-gradient(circle at 85% 25%, rgba(231, 201, 142, 0.08), transparent 18rem),
          linear-gradient(180deg, #0c0c0c 0%, #050505 100%);
        padding-bottom: 100px;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: calc(24px + env(safe-area-inset-top)) 20px 14px;
        background: rgba(5, 5, 5, 0.85);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
      }
      .brand img {
        height: 24px;
        width: auto;
        filter: brightness(1.2);
      }
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .culture-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 9999px;
        background: rgba(248, 245, 239, 0.06);
        border: 1px solid rgba(248, 245, 239, 0.12);
        color: var(--ink);
        font-size: 12px;
        font-weight: 550;
        text-decoration: none;
      }
      .culture-pill-icon {
        font-size: 13px;
      }
      .bottom-nav {
        position: fixed;
        left: 50%;
        bottom: 12px;
        z-index: 30;
        width: min(376px, calc(100% - 52px));
        min-height: 72px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        padding: 10px 15px 8px;
        border: 1px solid rgba(248, 245, 239, 0.06);
        border-radius: 28px;
        background: rgba(25, 25, 24, 0.82);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.05),
          0 18px 44px rgba(0, 0, 0, 0.42);
        backdrop-filter: blur(26px);
        transform: translateX(-50%);
      }
      .nav-link {
        min-width: 0;
        display: grid;
        justify-items: center;
        align-content: center;
        gap: 5px;
        color: rgba(248, 245, 239, 0.62);
        font-size: 12px;
        font-weight: 560;
        text-decoration: none;
      }
      .nav-link.active {
        color: var(--peach);
      }
      .nav-link svg {
        width: 27px;
        height: 27px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .nav-link.active svg {
        fill: currentColor;
        stroke-width: 0;
      }
    </style>
  </head>
  <body data-page="linkup">
    <div class="app-shell">
      <!-- Top Bar -->
      <header class="topbar" aria-label="Echoo">
        <a class="brand" href="index.html" aria-label="Echoo home">
          <img src="assets/echoo-wordmark.png" alt="echoo" />
        </a>
        <div class="topbar-actions">
          <a class="culture-pill" href="culture.html" aria-label="Culture Lens settings">
            <span class="culture-pill-icon">🌐</span>
            <span>Culture</span>
          </a>
          <a class="echoo-linkup-settings-link" href="linkup-settings.html" aria-label="Link Up settings">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </a>
        </div>
      </header>

      <!-- Link Up module -->
      <main class="echoo-linkup-module">
        <!-- Hero -->
        <section class="echoo-linkup-module-hero">
          <div class="echoo-linkup-module-title-wrap">
            <h1 class="echoo-linkup-module-title">Link up.</h1>
            <p class="echoo-linkup-module-subtitle">
              <span class="gold-accent">Right people. Right place.</span><br />
              Real connections.
            </p>
          </div>
          <div class="echoo-linkup-ring-badge" aria-hidden="true">
            <div class="echoo-linkup-ring-badge-inner">
              <svg viewBox="0 0 24 24">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
              </svg>
            </div>
          </div>
        </section>

        <!-- Live state viewport — rendered by EchooLinkUp.initHub() -->
        <section id="echoo-linkup-viewport" class="echoo-linkup-viewport" data-linkup-viewport>
          <div class="echoo-linkup-state">
            <div class="echoo-linkup-spinner" aria-label="Loading Link Up"></div>
          </div>
        </section>

        <!-- How it works — honest static explainer with real routing -->
        <section class="echoo-linkup-connect-card">
          <h3 class="echoo-linkup-connect-title">How Link Up works</h3>
          <div class="echoo-linkup-ways-list">
            <a class="echoo-linkup-way-row echoo-linkup-settings-link-row" href="events.html" aria-label="Find a place and check in">
              <div class="echoo-linkup-way-left">
                <div class="echoo-linkup-way-icon">
                  <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" /><circle cx="12" cy="10" r="3" /></svg>
                </div>
                <span class="echoo-linkup-way-text">Find a place &amp; check in</span>
              </div>
              <div class="echoo-linkup-way-arrow"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" /></svg></div>
            </a>
            <a class="echoo-linkup-way-row echoo-linkup-settings-link-row" href="culture.html" aria-label="Tune your Culture Lens">
              <div class="echoo-linkup-way-left">
                <div class="echoo-linkup-way-icon">
                  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" /></svg>
                </div>
                <span class="echoo-linkup-way-text">Tune your Culture Lens</span>
              </div>
              <div class="echoo-linkup-way-arrow"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" /></svg></div>
            </a>
            <a class="echoo-linkup-way-row echoo-linkup-settings-link-row" href="linkup-settings.html" aria-label="Pause or manage Link Up">
              <div class="echoo-linkup-way-left">
                <div class="echoo-linkup-way-icon">
                  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
                </div>
                <span class="echoo-linkup-way-text">Pause or manage Link Up</span>
              </div>
              <div class="echoo-linkup-way-arrow"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" /></svg></div>
            </a>
          </div>
        </section>
      </main>

      <!-- Floating Bottom Navigation -->
      <nav class="bottom-nav" aria-label="Main navigation">
        <a class="nav-link" href="index.html">
          <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V21h-6v-6H9v6H3Z" /></svg>
          <span>Home</span>
        </a>
        <a class="nav-link" href="events.html">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m16 16 4 4" /></svg>
          <span>Discover</span>
        </a>
        <a class="nav-link active" href="linkup.html" aria-current="page">
          <svg viewBox="0 0 24 24">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
          </svg>
          <span>Link Up</span>
        </a>
        <a class="nav-link" href="auth.html">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></svg>
          <span>Profile</span>
        </a>
      </nav>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/echoo-auth.js"></script>
    <script src="assets/culture-context.js"></script>
    <script src="assets/echoo-linkup.js"></script>
    <script src="assets/page-loader.js"></script>
  </body>
</html>
