      function surpriseProfileAffinity(item) {
        const terms = onboardingSignals()
          .map((value) => String(value).toLowerCase())
          .filter((value) => value.length > 2);
        if (!terms.length) return 0.35;
        const text =
          `${item?.title || ""} ${item?.category || ""} ${item?.description || ""} ${(item?.features || []).join(" ")}`.toLowerCase();
        return Math.min(
          1,
          terms.filter((term) => text.includes(term)).length /
            Math.min(terms.length, 3),
        );
      }

      function surpriseScore(item) {
        const distance = Number(item?.distanceMeters);
        const nearby = Number.isFinite(distance)
          ? Math.max(0, 1 - distance / 35_000)
          : 0.48;
        const profileMatch = surpriseProfileAffinity(item);
        const time = timeContext().query;
        const text =
          `${item?.title || ""} ${item?.category || ""} ${item?.description || ""}`.toLowerCase();
        const timeMatch =
          time
            .split(" ")
            .filter((word) => word.length > 3 && text.includes(word)).length *
          0.08;
        return (
          nearby * 0.45 +
          profileMatch * 0.32 +
          Math.min(timeMatch, 0.16) +
          hotScoreFor(item) * 0.07
        );
      }

      function surpriseHistory() {
        try {
          const saved = JSON.parse(
            localStorage.getItem(SURPRISE_HISTORY_KEY) || "[]",
          );
          return Array.isArray(saved)
            ? saved.filter((entry) => entry?.id && entry?.style).slice(0, 24)
            : [];
        } catch (_) {
          return [];
        }
      }

      function rememberSurprise(item) {
        const entry = {
          id: placeKey(item),
          style: categoryGroup(item),
          city,
          seenAt: Date.now(),
        };
        const previous = surpriseHistory().filter(
          (saved) => saved.id !== entry.id,
        );
        try {
          localStorage.setItem(
            SURPRISE_HISTORY_KEY,
            JSON.stringify([entry, ...previous].slice(0, 24)),
          );
        } catch (_) {}
      }

      function randomIndex(length) {
        if (length <= 1) return 0;
        const values = new Uint32Array(1);
        if (window.crypto?.getRandomValues) {
          window.crypto.getRandomValues(values);
          return values[0] % length;
        }
        return Math.floor(Math.random() * length);
      }

      async function revealSurprise() {
        const revealId = ++surpriseRevealId;
        const discoveryPool = mergeDiscoveryItems(
          mergeDiscoveryItems(nearbyItems, recommendedItems),
          items,
        );
        const ranked = discoveryPool
          .map((item) => ({ item, score: surpriseScore(item) }))
          .sort((left, right) => right.score - left.score)
          .slice(0, Math.min(30, discoveryPool.length));
        // Prefer a real hero image, but never replace a valid local result with
        // a hard-coded place from another municipality.
        const candidates = ranked
          .filter((entry) => Boolean(realImageUrl(entry.item)))
          .slice(0, Math.min(30, ranked.length));
        const localDefaults = defaultPlaces
          .filter(
            (item) =>
              String(item.city || "").toLowerCase() === city.toLowerCase(),
          )
          .map((item) => ({ item, score: surpriseScore(item) }));
        const curated = candidates.length
          ? candidates
          : ranked.length
            ? ranked
            : localDefaults;
        const history = surpriseHistory();
        const cityHistory = history.filter((entry) => entry.city === city);
        const unseen = curated.filter(
          ({ item }) =>
            !cityHistory.some((entry) => entry.id === placeKey(item)),
        );
        const unseenPool = unseen.length ? unseen : curated;
        const previousStyle = cityHistory[0]?.style;
        const varied = unseenPool.filter(
          ({ item }) => categoryGroup(item) !== previousStyle,
        );
        const pool = varied.length ? varied : unseenPool;
        if (!pool.length) {
          surpriseLoader.hidden = true;
          return;
        }
        const choice = pool[randomIndex(pool.length)].item;
        rememberSurprise(choice);
        const loaderCopy = document.getElementById("surprise-loader-copy");
        if (loaderCopy)
          loaderCopy.textContent = `Matching ${city}, your preferences, and ${timeContext().label}.`;
        const loaderStartedAt = Number(
          surpriseLoader.dataset.startedAt || Date.now(),
        );
        const remaining = Math.max(0, 3000 - (Date.now() - loaderStartedAt));
        if (remaining)
          await new Promise((resolve) => setTimeout(resolve, remaining));
        if (revealId !== surpriseRevealId) return;
        let handedOff = false;
        await openDetailByItem(choice, {
          onReady: () => {
            if (revealId !== surpriseRevealId) return;
            handedOff = true;
            surpriseLoader.hidden = true;
          },
        });
        if (!handedOff && revealId === surpriseRevealId)
          surpriseLoader.hidden = true;
      }

      async function clearDeviceLocation(
        permissionState,
        { refresh = true } = {},
      ) {
        const previousScope = cacheLocationScope({ city, lat, lng });
        lat = NaN;
        lng = NaN;
        discoveryLocation = null;

          lastLat: undefined,

      async function preflightStoredDeviceLocation() {
        if (!(Number.isFinite(lat) && Number.isFinite(lng))) return;
        if (!navigator.permissions?.query) {
          // Do not send a session coordinate until getCurrentPosition confirms
          // that the browser still grants location access.
          lat = NaN;
          lng = NaN;
          discoveryLocation = null;
          return;
        }
        try {
          const permission = await navigator.permissions.query({
            name: "geolocation",
          });
          if (permission.state !== "granted") {
            await clearDeviceLocation(
              permission.state === "denied" ? "denied" : "prompt",
              { refresh: false },
            );
          }
        } catch (_) {
          lat = NaN;
          lng = NaN;
          discoveryLocation = null;
        }
      }

      async function refreshGrantedDeviceLocation({
        timeoutMs = 12000,
        refreshResults = true,
      } = {}) {
        if (!navigator.geolocation) return false;
        let permissionState = prefs.locationPermissionState || "prompt";
        if (navigator.permissions?.query) {
          try {
            const permission = await navigator.permissions.query({
              name: "geolocation",
            });
            permissionState = permission.state;
          } catch (_) {}
        }
        if (permissionState !== "granted") {
          if (
            prefs.locationPermissionState === "granted" ||
            (Number.isFinite(lat) && Number.isFinite(lng))
          ) {
            await clearDeviceLocation(
              permissionState === "denied" ? "denied" : "prompt",
              { refresh: refreshResults },
            );
          }
          return false;
        }
        return applyCurrentLocation({
          silent: true,
          timeoutMs,
          refreshResults,
        });
      }

      function stableDeviceCoordinates(position) {
        const nextLat = Number(position?.coords?.latitude);
        const nextLng = Number(position?.coords?.longitude);
        const nextAccuracy = Math.max(
          0,
          Number(position?.coords?.accuracy) || 0,
        );
        const previousLat = Number(prefs.lastLat);
        const previousLng = Number(prefs.lastLng);
        const previousAccuracy = Math.max(0, Number(prefs.accuracy) || 0);
        const capturedAt = new Date(prefs.locationCheckedAt || 0).getTime();
        const recentEnough =
          Number.isFinite(capturedAt) &&
          Date.now() - capturedAt < 20 * 60 * 1000;
        if (
          !recentEnough ||
          !Number.isFinite(previousLat) ||
          !Number.isFinite(previousLng) ||
          !Number.isFinite(nextLat) ||
          !Number.isFinite(nextLng)
        ) {
          return {
            lat: nextLat,
            lng: nextLng,
            accuracy: nextAccuracy,
            stabilized: false,
          };
        }
        const movementMeters =
          window.EchooLocationPlatform.distanceKm(
            previousLat,
            previousLng,
            nextLat,
            nextLng,
          ) * 1000;
        // Small changes around a municipal boundary are often GPS drift, not
        // a meaningful change in intent. Keep one trusted anchor until the
        // device reports movement beyond its combined confidence envelope.
        const stabilityRadius = Math.min(
          900,
          Math.max(150, nextAccuracy * 1.5, previousAccuracy * 1.5),
        );
        if (movementMeters <= stabilityRadius) {
          return {
            lat: previousLat,
            lng: previousLng,
            accuracy: Math.max(nextAccuracy, previousAccuracy),
            stabilized: true,
          };
        }
        return {
          lat: nextLat,
          lng: nextLng,
          accuracy: nextAccuracy,
          stabilized: false,
        };
      }

      function resetLocationGpsButton() {
        if (!useLocationButton) return;
        useLocationButton.disabled = false;
        useLocationButton.innerHTML =
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z" /><circle cx="12" cy="10" r="2.5" /></svg>Use my location';
      }

      async function applyCurrentLocation({
        silent = false,
        timeoutMs = 12000,
        refreshResults = true,
      } = {}) {
        if (!navigator.geolocation) {
          if (!silent)
            rememberLocationChoice({
              locationPermissionState: "unavailable",
              locationPrecision: "manual_region",
            });
          closeLocationSheet();
          return false;
        }
        if (!silent && useLocationButton) {
          useLocationButton.disabled = true;
          useLocationButton.textContent = "Checking…";
        }
        const previousScope = cacheLocationScope({
          city,
          lat: Number.isFinite(lat) ? lat : undefined,
          lng: Number.isFinite(lng) ? lng : undefined,
        });
        return new Promise((resolve) =>
          navigator.geolocation.getCurrentPosition(
            async (position) => {
              const deviceLocation = stableDeviceCoordinates(position);
              lat = deviceLocation.lat;
              lng = deviceLocation.lng;
              let locationContext = null;
              try {
                const response = await fetch(CONFIG.locationContextUrl, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    lat,
                    lng,
                    accuracyMeters: deviceLocation.accuracy,
                  }),
                });
                if (response.ok) locationContext = await response.json();
              } catch (_) {}
              const resolved = window.EchooLocationPlatform.resolveCoordinates(
                lat,
                lng,
              );
              // Municipal boundaries, not city-centre proximity, decide the
              // label and live-search context. If an official boundary is not
              // available yet, retain precise distance ranking but stay GTA-wide.
              city = locationContext?.supported
                ? locationContext.municipality || "Greater Toronto Area"
                : resolved.supported
                  ? "Greater Toronto Area"
                  : DEFAULT_DISCOVERY_CITY;
              discoveryLocation = null;
              if (!resolved.supported) {
                // Do not keep sending out-of-coverage coordinates after the
                // regional fallback has been chosen.
                lat = NaN;
                lng = NaN;
              }
              rememberLocationChoice({
                lastLat: lat,
                lastLng: lng,
                accuracy: deviceLocation.accuracy,
                city,
                locationPermissionState: "granted",
                locationPrecision: "gps",
                locationReason: locationContext?.municipality
                  ? "device_gta_boundary"
                  : resolved.supported
                    ? "device_gta"
                    : "outside_gta_fallback",
                locationMunicipality: locationContext?.municipality || null,
                locationBoundaryResolved: Boolean(
                  locationContext?.boundaryResolved,
                ),
                locationStabilized: deviceLocation.stabilized,
              });
              if (
                locationMunicipality &&
                window.EchooLocationPlatform.cityByName(city)?.coverageLevel ===
                  "municipality"
              ) {
                locationMunicipality.value = city;
              }
              updateLocationBadge();
              rememberDiscoveryLocationInUrl();
              closeLocationSheet();
              const nextScope = cacheLocationScope({ city, lat, lng });
              if (refreshResults && nextScope !== previousScope)
                await search(activeQuery, { contextChanged: true });
              if (!silent) resetLocationGpsButton();
              resolve(Boolean(resolved.supported));
            },
            async (error) => {
              if (Number(error?.code) === 1) {
                await clearDeviceLocation("denied", {
                  refresh: refreshResults,
                });
              }
              if (!silent) resetLocationGpsButton();
              closeLocationSheet();
              resolve(false);
            },
            {
              enableHighAccuracy: true,
              timeout: timeoutMs,
              maximumAge: 60000,
            },
          ),
        );
      }

      function discoveryIntentForActiveView() {
        if (
          [
            "discover",
            "food",
            "comedy",
            "music",
            "nightlife",
            "events",
            "tourism",
          ].includes(activeQuery)
        ) {
          return activeQuery;
        }
        return "search";
      }

      function discoveryRequestForActiveView() {
        const culture = activeCulture();
        const base = cultureContext?.queryFor
          ? cultureContext.queryFor(activeQuery, culture)
          : activeQuery === "discover"
            ? "popular places things to do"
            : activeQuery;
        return {
          version: 2,
          intent: discoveryIntentForActiveView(),
          cultureSlug: culture?.slug || undefined,
          // The selected filter stays the search intent. Profile and time are
          // passed separately as ranking signals so "Music" cannot turn into
          // an unrelated literal phrase such as "music yoga coffee".
          query: base,
          city,
          lat: Number.isFinite(lat) ? lat : undefined,
          lng: Number.isFinite(lng) ? lng : undefined,
          // GPS should rank the closest places first without shrinking the
          // catalogue to one small circle. The server caps this to the GTA
          // search envelope and keeps it cursor-paginated.
          radiusMeters:
            Number.isFinite(lat) && Number.isFinite(lng) ? 100000 : undefined,
          preferenceFeatureSlugs: !culture
            ? [
                ...new Set([
                  ...preferenceFeatureSlugs().slice(0, 8),
                  ...timePreferenceSlugs(),
                ]),
              ]
            : timePreferenceSlugs(),
          includeLiveFallback: true,
          // One visual page at a time; the cursor continues across the full
          // GTA inventory instead of treating ten as the total.
          limit: 20,
        };
      }

      function personalizationSignature(value = {}) {
        const profile = value.personalizationProfile || {};
        return JSON.stringify({
          interests: profile.interests || value.interests || [],
          eventStyles: profile.eventStyles || value.eventStyles || [],
          motivations: profile.motivations || value.motivations || [],
          budget: profile.budget || value.budget || "",
          energy: profile.energy || value.energy || "",
        });
      }

      async function hydrateOnboardingSignals({ refresh = true } = {}) {
        if (!window.EchooAuth?.loadOnboardingProfile) return;
        const before = personalizationSignature(prefs);
        try {
          const profileState = await window.EchooAuth.loadOnboardingProfile();
          if (!profileState?.preferences) return;
          prefs = window.EchooLocationPlatform.readPreferences();
          if (
            !(Number.isFinite(lat) && Number.isFinite(lng)) &&
            !params.has("city")
          ) {
            const nextCity =
              window.EchooLocationPlatform.cityByName(prefs.city)?.name || city;
            if (nextCity !== city) discoveryLocation = null;
            city = nextCity;
            rememberDiscoveryLocationInUrl();
          }
          if (refresh && personalizationSignature(prefs) !== before) {
            updateLocationBadge();
            await search(activeQuery, { contextChanged: true });
          }
        } catch (_) {
          // Discover still works with the local preference cache for guests
          // and during a transient profile-sync failure.
        }
      }

      function mergeDiscoveryItems(existing, incoming) {
        const merged = [...existing, ...incoming];
        return merged.filter((item, index) => {
          const key = placeKey(item);
          return (
            key &&
            merged.findIndex((candidate) => placeKey(candidate) === key) ===
              index
          );
        });
      }

      async function fetchDiscoveryPage({
        append = false,
        requestId = discoveryRequestId,
        render = true,
      } = {}) {
        const request = discoveryPaging.request;
        if (!request || discoveryPaging.loading) return;
        discoveryPaging.loading = true;
        const refreshButton = document.getElementById("discover-refresh");
        refreshButton.disabled = true;
        refreshButton.classList.add("is-refreshing");
        refreshButton.setAttribute("aria-label", "Refreshing places");
        if (render) renderResultsPage();
        const controller = new AbortController();
        discoveryAbortController = controller;
        const timeout = setTimeout(
          () => controller.abort(),
          DISCOVERY_NETWORK_TIMEOUT_MS,
        );
        try {
          const response = await fetch(CONFIG.exploreUrl, {
            method: "POST",
            headers,
            body: JSON.stringify({
              ...request,
              cursor: append ? discoveryPaging.cursor : undefined,
            }),
            signal: controller.signal,
          });
          const payload = await response.json().catch(() => ({}));
          if (requestId !== discoveryRequestId) return;
          if (!response.ok)
            throw new Error(
              payload?.error || "Discover is unavailable right now.",
            );
          const received = Array.isArray(payload?.all?.items)
            ? payload.all.items
            : [];
          if (!append || !discoveryStoredAt) discoveryStoredAt = Date.now();
          if (!append) {
            items = received;
            nearbyItems = Array.isArray(payload?.nearby?.items)
              ? payload.nearby.items
              : [];
            recommendedItems = Array.isArray(payload?.recommended?.items)
              ? payload.recommended.items
              : [];
            discoveryLocation = payload?.location || null;
            updateLocationBadge();
            discoveryLoadFailed = !(
              items.length ||
              nearbyItems.length ||
              recommendedItems.length
            );
          } else {
            items = mergeDiscoveryItems(items, received);
          }
          discoveryPaging.cursor = payload?.all?.pagination?.nextCursor || null;
          discoveryPaging.hasMore = Boolean(discoveryPaging.cursor);
          // A municipality can occasionally be ahead of the live index. Fall
          // back to the GTA feed rather than leaving the page empty.
          if (
            !received.length &&
            payload.supported === false &&
            city !== DEFAULT_DISCOVERY_CITY
          ) {
            city = DEFAULT_DISCOVERY_CITY;
            lat = NaN;
            lng = NaN;
            discoveryLocation = null;
            updateLocationBadge();
            rememberDiscoveryLocationInUrl();
            discoveryPaging.request = discoveryRequestForActiveView();
            currentSurfaceIdentity = discoveryCacheIdentity(
              discoveryPaging.request,
            );
            activeRequestIdentity = currentSurfaceIdentity;
            discoveryPaging.loading = false;
            return fetchDiscoveryPage({ append: false, requestId, render });
          }
          if (
            !append &&
            (items.length || nearbyItems.length || recommendedItems.length)
          ) {
            writeDiscoveryCache(request, {
              nearby: nearbyItems,
              recommended: recommendedItems,
              all: items,
              location: discoveryLocation,
              storedAt: discoveryStoredAt,
              nextCursor: discoveryPaging.cursor,
              resultPage,
            });
          }
          if (render) {
            if (requestId !== discoveryRequestId) return;
            renderItems();
          }
        } catch (_) {
          if (requestId !== discoveryRequestId) return;
          if (
            !append &&
            ![...items, ...nearbyItems, ...recommendedItems].some(
              (item) => !item.isFallback,
            )
          ) {
            items = [];
            nearbyItems = [];
            recommendedItems = [];
          }
          discoveryLoadFailed = !(
            items.length ||
            nearbyItems.length ||
            recommendedItems.length
          );
          if (!append) discoveryPaging.hasMore = false;
          if (render) renderItems();
        } finally {
          clearTimeout(timeout);
          if (requestId === discoveryRequestId) {
            discoveryPaging.loading = false;
            activeRequestIdentity = "";
            if (discoveryAbortController === controller)
              discoveryAbortController = null;
            resetRefreshControl();
            if (render) renderResultsPage();
          }
        }
      }

      async function search(query = activeQuery, options = {}) {
        let cleanQuery = String(query || "")
          .trim()
          .toLowerCase();
        if (!cleanQuery) cleanQuery = "discover";
        const previousQuery = activeQuery;
        persistCurrentSurface();
        activeQuery = cleanQuery;
        applyCultureMood();
        document
          .querySelectorAll(".chip")
          .forEach((chip) =>
            chip.classList.toggle("active", chip.dataset.query === activeQuery),
          );
        if (activeQuery === "upcoming drop") {
          window.location.assign(
            `happenings.html?category=upcoming${activeCulture() ? `&culture=${encodeURIComponent(activeCulture().slug)}` : ""}`,
          );
          return;
        }
        if (options.fromSearch)
          queryInput.value =
            cleanQuery === "discover" ? "" : String(query || "").trim();
        suggestionsEl.hidden = true;
        const nextPaging = {
          cursor: null,
          hasMore: false,
          request: discoveryRequestForActiveView(),
          loading: false,
        };
        const nextIdentity = discoveryCacheIdentity(nextPaging.request);
        if (
          !options.refresh &&
          !options.surprise &&
          !options.contextChanged &&
          currentSurfaceIdentity === nextIdentity &&
          (items.length || nearbyItems.length || recommendedItems.length)
        ) {
          rememberActiveDiscoveryQuery();
          return;
        }
        if (
          !options.refresh &&
          activeRequestIdentity === nextIdentity &&
          discoveryPaging.loading
        )
          return;

        const requestId = ++discoveryRequestId;
        discoveryAbortController?.abort();
        discoveryAbortController = null;
        resetRefreshControl();
        activeRequestIdentity = nextIdentity;
        currentSurfaceIdentity = nextIdentity;
        resultPage =
          previousQuery === activeQuery && !options.contextChanged
            ? resultPage
            : 0;
        if (discoveryFastFallbackTimer)
          window.clearTimeout(discoveryFastFallbackTimer);
        discoveryPaging = nextPaging;
        rememberActiveDiscoveryQuery();
        const cachedSurface = !options.refresh
          ? readDiscoveryCache(discoveryPaging.request)
          : null;
        if (cachedSurface) {
          nearbyItems = Array.isArray(cachedSurface?.lanes?.nearby)
            ? cachedSurface.lanes.nearby
            : [];
          recommendedItems = Array.isArray(cachedSurface?.lanes?.recommended)
            ? cachedSurface.lanes.recommended
            : [];
          items = Array.isArray(cachedSurface?.lanes?.all)
            ? cachedSurface.lanes.all
            : [];
          discoveryLocation = cachedSurface.location || null;
          discoveryStoredAt = Number(cachedSurface.storedAt) || Date.now();
          discoveryPaging.cursor = cachedSurface.nextCursor;
          discoveryPaging.hasMore = Boolean(discoveryPaging.cursor);
          resultPage = Math.max(0, Number(cachedSurface.resultPage) || 0);
          if (items.length || nearbyItems.length || recommendedItems.length) {
            discoveryLoadFailed = false;
            updateLocationBadge();
            persistCurrentSurface();
            renderItems();
            activeRequestIdentity = "";
            const cachedCards = mergeDiscoveryItems(
              mergeDiscoveryItems(nearbyItems, recommendedItems),
              items,
            );
            renewDiscoveryImages(cachedCards, requestId).then((renewed) => {
              if (requestId !== discoveryRequestId) return;
              const renewedByKey = new Map(
                renewed.map((item) => [placeKey(item), item]),
              );
              const applyRenewal = (list) =>
                list.map((item) => renewedByKey.get(placeKey(item)) || item);
              nearbyItems = applyRenewal(nearbyItems);
              recommendedItems = applyRenewal(recommendedItems);
              items = applyRenewal(items);
              persistCurrentSurface();
              renderItems();
            });
            if (options.surprise) await revealSurprise();
            return;
          }
        }
        if (
          options.refresh &&
          (items.length || nearbyItems.length || recommendedItems.length)
        ) {
          renderDiscoverLoading({ preserveVisibleResults: true });
        } else {
          items = [];
          nearbyItems = [];
          recommendedItems = [];
          discoveryStoredAt = 0;
          renderDiscoverLoading({ allowFallback: options.surprise });
        }
        // Remote inventory can enrich in the background, but Discover itself
        // must always become useful promptly. A slow provider never leaves a
        // person staring at skeletons with no way forward.
        const discoveryPromise = fetchDiscoveryPage({
          requestId,
          render: true,
        });
        if (options.surprise) {
          // The full-screen loader owns the transition, so Discover can render
          // behind it. Race the provider against the local starter set so the
          // animated die can never be stranded by a slow network request.
          await Promise.race([
            discoveryPromise,
            new Promise((resolve) => window.setTimeout(resolve, 1450)),
          ]);
          if (!(items.length || nearbyItems.length || recommendedItems.length))
            await discoveryPromise;
          if (!(
            items.length ||
            nearbyItems.length ||
            recommendedItems.length
          )) {
            items = defaultPlaces
              .filter(
                (place) =>
                  String(place.city || "").toLowerCase() === city.toLowerCase(),
              )
              .map((place) => ({ ...place }));
            discoveryPaging.hasMore = false;
            renderItems();
          }
          await revealSurprise();
          return;
        }
        await discoveryPromise;
      }

      async function showNextResultsPage() {
        const pageSize = 10;
        if ((resultPage + 1) * pageSize < items.length) {
          resultPage += 1;
          persistCurrentSurface();
          renderResultsPage();
          return;
        }
        if (discoveryPaging.hasMore) {
          const before = items.length;
          await fetchDiscoveryPage({ append: true });
          if (items.length > before) resultPage += 1;
          persistCurrentSurface();
          renderResultsPage();
        }
      }

      function openDetail(index) {
        const item = items[index];
        if (!item) return;
        openDetailByItem(item);
      }

      function closeDetail() {
        closeDetailSheet();
      }

      const quickPlanModal = document.getElementById("quick-plan-modal");
      const quickPlanContent = document.getElementById("quick-plan-content");
      const quickPlanBackdrop = document.getElementById("quick-plan-backdrop");
      let quickPlanState = null;
      let quickPlanRequestId = 0;

      function quickPlanBudget() {
        const value = prefs.budget || "$";
        return value === "$"
          ? "value"
          : value === "$$$"
            ? "elevated"
            : "balanced";
      }

      function quickPlanHistoryKey(anchor) {
        return `echoo_quick_plan_seen:${String(anchor?.id || "").slice(0, 180)}`;
      }

      function quickPlanRecent(anchor) {
        try {
          const saved = JSON.parse(
            localStorage.getItem(quickPlanHistoryKey(anchor)) || "[]",
          );
          return Array.isArray(saved)
            ? saved.filter((id) => typeof id === "string").slice(0, 30)
            : [];
        } catch (_) {
          return [];
        }
      }

      function rememberQuickPlan(anchor, plan) {
        const next = (plan?.stops || [])
          .filter((stop) => !stop.isAnchor)
          .map((stop) => String(stop.id || ""))
          .filter(Boolean);
        if (!next.length) return;
        try {
          localStorage.setItem(
            quickPlanHistoryKey(anchor),
            JSON.stringify(
              [...new Set([...next, ...quickPlanRecent(anchor)])].slice(0, 30),
            ),
          );
        } catch (_) {}
      }

      function closeQuickPlan() {
        quickPlanRequestId += 1;
        quickPlanModal?.setAttribute("aria-hidden", "true");
        if (quickPlanContent) quickPlanContent.replaceChildren();
      }

      function quickPlanStopCover(stop) {
        const image = String(stop?.imageUrl || "").trim();
        const fallback = `<span class="echoo-quick-plan-stop-cover" aria-hidden="true"></span>`;
        return /^https?:\/\//i.test(image)
          ? `<img class="echoo-quick-plan-stop-image" src="${esc(image)}" alt="" loading="lazy" decoding="async" onerror="this.hidden=true;this.nextElementSibling.hidden=false" />${fallback.replace(" aria-hidden", " hidden aria-hidden")}`
          : fallback;
      }

      function renderQuickPlan() {
        if (!quickPlanState || !quickPlanContent) return;
        const { anchor, stopCount, budgetStyle, loading, error, plan } =
          quickPlanState;
        const name = String(anchor?.name || "this place");
        const choice = (kind, value, label, active) =>
          `<button type="button" class="echoo-quick-plan-choice" data-quick-plan-choice="${kind}" data-quick-plan-value="${value}" aria-pressed="${active}">${label}</button>`;
        const expectedStopCount = Number(stopCount) === 2 ? 2 : 3;
        const stops = Array.isArray(plan?.stops) ? plan.stops : [];
        const planHasExactStops = stops.length === expectedStopCount;
        const result = loading
          ? `<div class="echoo-quick-plan-loading" aria-live="polite"><span class="echoo-quick-plan-loading-label">Reading the area, your pace, and what is open.</span><span class="echoo-quick-plan-skeleton"></span><span class="echoo-quick-plan-skeleton"></span></div>`
          : plan && planHasExactStops
            ? `<div class="echoo-quick-plan-result">
                <div class="echoo-quick-plan-route-meta"><span>${esc(plan.subtitle || `Built around ${name}`)}</span><strong>${plan.totalTravelMinutes ? `~${plan.totalTravelMinutes} min between stops` : "A close-by loop"}</strong></div>
                <div class="echoo-quick-plan-plan-meta"><span>${esc(plan.budgetStyle || budgetStyle)} plan</span><span>Starts ${esc(stops[0]?.time || "now")}</span></div>
                <div class="echoo-quick-plan-stops">${stops
                  .map(
                    (stop, index) => `
                  <button class="echoo-quick-plan-stop" type="button" data-quick-plan-stop="${esc(stop.id)}">
                    <span class="echoo-quick-plan-stop-number">${index + 1}</span>
                    ${quickPlanStopCover(stop)}
                    <span class="echoo-quick-plan-stop-copy"><strong>${esc(stop.name)}</strong><span>${esc(index === 0 ? `${stop.reason || "Your anchor"} · ${stop.category || "Place"}` : `${stop.travelMinutes || ""} min away · ${stop.reason || "Nearby"}${stop.priceLabel ? ` · ${stop.priceLabel}` : ""}`)}</span></span>
                    <span class="echoo-quick-plan-stop-time">${esc(stop.time || "")}</span>
                  </button>`,
                  )
                  .join("")}
                </div>
              </div>`
            : `<p class="echoo-quick-plan-error">${esc(error || `Echoo could not make a reliable ${expectedStopCount}-stop plan around this place yet.`)}</p>`;
        quickPlanContent.innerHTML = `
          <div class="echoo-quick-plan-topline"><p class="echoo-quick-plan-kicker">Quick Plan</p><button class="echoo-quick-plan-close" type="button" data-quick-plan-close aria-label="Close Quick Plan">×</button></div>
          <div class="echoo-quick-plan-heading"><div><h2 id="quick-plan-title">Around ${esc(name)}</h2><p>One useful plan, already shaped to your profile.</p></div></div>
          <div class="echoo-quick-plan-controls" aria-label="Tune your plan">
            <div class="echoo-quick-plan-control-row">${choice("stops", 2, "2 stops", stopCount === 2)}${choice("stops", 3, "3 stops", stopCount === 3)}</div>
            <div class="echoo-quick-plan-control-row">${choice("budget", "value", "Value", budgetStyle === "value")}${choice("budget", "balanced", "Balanced", budgetStyle === "balanced")}${choice("budget", "elevated", "Elevated", budgetStyle === "elevated")}</div>
          </div>
          ${result}
          ${plan && planHasExactStops ? `<div class="echoo-quick-plan-footer"><p class="echoo-quick-plan-note">${esc(plan.availabilityNote || "Built from live Echoo place data.")}</p><button type="button" class="echoo-quick-plan-route-button" data-quick-plan-route>Start directions</button></div>` : ""}`;
        quickPlanContent
          .querySelector("[data-quick-plan-close]")
          ?.addEventListener("click", closeQuickPlan);
        quickPlanContent
          .querySelectorAll("[data-quick-plan-choice]")
          .forEach((button) => {
            button.addEventListener("click", () => {
              const kind = button.getAttribute("data-quick-plan-choice");
              const value = button.getAttribute("data-quick-plan-value");
              if (kind === "stops")
                quickPlanState.stopCount = Number(value) === 2 ? 2 : 3;
              if (kind === "budget")
                quickPlanState.budgetStyle = value || "balanced";
              loadQuickPlan();
            });
          });
        quickPlanContent
          .querySelectorAll("[data-quick-plan-stop]")
          .forEach((button) => {
            button.addEventListener("click", () => {
              const stop = stops.find(
                (item) =>
                  item.id === button.getAttribute("data-quick-plan-stop"),
              );
              if (!stop) return;
              closeQuickPlan();
              openDetailByItem({
                id: stop.id,
                title: stop.name,
                category: stop.category,
                address: stop.address,
                latitude: stop.latitude,
                longitude: stop.longitude,
                imageUrl: stop.imageUrl,
              });
            });
          });
        quickPlanContent
          .querySelector("[data-quick-plan-route]")
          ?.addEventListener("click", () => {
            if (!stops.length) return;
            if (window.ReactNativeWebView?.postMessage) {
              window.ReactNativeWebView.postMessage(
                `echoo:route-plan:${JSON.stringify({ stops })}`,
              );
              return;
            }
            const validStops = stops.filter(
              (stop) =>
                Number.isFinite(Number(stop.latitude)) &&
                Number.isFinite(Number(stop.longitude)),
            );
            if (!validStops.length) return;
            const coordinate = `${validStops[0].latitude},${validStops[0].longitude}`;
            const isAppleDevice = /iPad|iPhone|iPod/.test(navigator.userAgent);
            const url = isAppleDevice
              ? `https://maps.apple.com/?daddr=${encodeURIComponent(coordinate)}&dirflg=d`
              : (() => {
                  const destination = validStops.at(-1);
                  const waypoints = validStops
                    .slice(0, -1)
                    .map((stop) => `${stop.latitude},${stop.longitude}`)
                    .join("|");
                  const params = new URLSearchParams({
                    api: "1",
                    destination: `${destination.latitude},${destination.longitude}`,
                    dir_action: "navigate",
                  });
                  if (waypoints) params.set("waypoints", waypoints);
                  return `https://www.google.com/maps/dir/?${params.toString()}`;
                })();
            window.open(url.toString(), "_blank", "noopener,noreferrer");
          });
      }

      async function loadQuickPlan() {
        if (!quickPlanState?.anchor?.id) return;
        const requestId = ++quickPlanRequestId;
        quickPlanState.loading = true;
        quickPlanState.error = "";
        renderQuickPlan();
        try {
          const requestHeaders = window.EchooAuth?.authHeaders
            ? await window.EchooAuth.authHeaders({
                "Content-Type": "application/json",
              })
            : headers;
          const response = await fetch(CONFIG.quickPlanUrl, {
            method: "POST",
            headers: requestHeaders,
            body: JSON.stringify({
              anchor: quickPlanState.anchor,
              stopCount: quickPlanState.stopCount,
              budgetStyle: quickPlanState.budgetStyle,
              recentPlaceIds: quickPlanRecent(quickPlanState.anchor),
              rotationKey: `${quickPlanState.anchor.id}:${quickPlanState.stopCount}:${quickPlanState.budgetStyle}:${++quickPlanState.variation}`,
              profile: {
                interests: prefs.interests || [],
                eventStyles: prefs.eventStyles || [],
                audiences: prefs.audiences || [],
                motivations: prefs.motivations || [],
                budget: prefs.budget || "$",
                energy: prefs.energy || "chill",
                city,
              },
            }),
          });
          const payload = await response.json().catch(() => ({}));
          if (requestId !== quickPlanRequestId) return;
          const expectedStopCount =
            Number(quickPlanState.stopCount) === 2 ? 2 : 3;
          const stops = Array.isArray(payload?.plan?.stops)
            ? payload.plan.stops
            : [];
          if (!response.ok || !payload?.plan)
            throw new Error(
              payload?.error ||
                "Quick Plan could not build a reliable route right now.",
            );
          if (stops.length !== expectedStopCount) {
            throw new Error(
              `Echoo received an incomplete plan. Please try the ${expectedStopCount}-stop option again.`,
            );
          }
          quickPlanState.loading = false;
          quickPlanState.plan = {
            ...payload.plan,
            stops,
            stopCount: expectedStopCount,
            requestedStopCount: expectedStopCount,
          };
          rememberQuickPlan(quickPlanState.anchor, quickPlanState.plan);
          renderQuickPlan();
        } catch (error) {
          if (requestId !== quickPlanRequestId) return;
          quickPlanState.loading = false;
          quickPlanState.plan = null;
          quickPlanState.error =
            error?.message ||
            "Quick Plan could not build a reliable route right now.";
          renderQuickPlan();
        }
      }

      window.addEventListener("echoo:quick-plan", (event) => {
        const anchor = event.detail?.anchor;
        if (!anchor?.id) return;
        quickPlanState = {
          anchor,
          stopCount: 3,
          budgetStyle: quickPlanBudget(),
          loading: false,
          error: "",
          plan: null,
          variation: 0,
        };
        quickPlanModal?.setAttribute("aria-hidden", "false");
        loadQuickPlan();
      });
      quickPlanBackdrop?.addEventListener("click", closeQuickPlan);

      document.getElementById("search-form").onsubmit = (e) => {
        e.preventDefault();
        search(queryInput.value, { fromSearch: true });
      };

      document.getElementById("chips").onclick = (e) => {
        const chip = e.target.closest("[data-query]");
        if (chip) search(chip.dataset.query, { fromCategory: true });
      };

      resultsPrevious.addEventListener("click", () => {
        if (resultPage > 0) {
          resultPage -= 1;
          persistCurrentSurface();
          renderResultsPage();
        }
      });
      resultsNext.addEventListener("click", showNextResultsPage);

      document
        .querySelectorAll("[data-close-sheet]")
        .forEach((btn) => (btn.onclick = closeDetail));

      // FAB: tap on → off; tap off → picker; long-press → picker (characteristics)
      {
        const LONG_PRESS_MS = 480;
        let pressTimer = null;
        let longPressFired = false;
        let pressMoved = false;
        let startX = 0;
        let startY = 0;

        const clearPressTimer = () => {
          if (pressTimer) {
            clearTimeout(pressTimer);
            pressTimer = null;
          }
          cultureLensFab.classList.remove("is-pressing");
        };

        const openPickerFromFab = () => {
          if (navigator.vibrate) {
            try {
              navigator.vibrate(10);
            } catch (_error) {}
          }
          openCulturePicker();
        };

        cultureLensFab.addEventListener("pointerdown", (event) => {
          if (event.button != null && event.button !== 0) return;
          longPressFired = false;
          pressMoved = false;
          startX = event.clientX;
          startY = event.clientY;
          clearPressTimer();
          cultureLensFab.classList.add("is-pressing");
          pressTimer = setTimeout(() => {
            pressTimer = null;
            longPressFired = true;
            cultureLensFab.classList.remove("is-pressing");
            openPickerFromFab();
          }, LONG_PRESS_MS);
        });

        cultureLensFab.addEventListener("pointermove", (event) => {
          if (!pressTimer && !cultureLensFab.classList.contains("is-pressing"))
            return;
          const dx = event.clientX - startX;
          const dy = event.clientY - startY;
          if (dx * dx + dy * dy > 100) {
            pressMoved = true;
            clearPressTimer();
          }
        });

        cultureLensFab.addEventListener("pointerup", (event) => {
          const wasLong = longPressFired;
          const moved = pressMoved;
          clearPressTimer();
          if (wasLong || moved) return;
          if (event.button != null && event.button !== 0) return;
          if (activeCulture()) {
            cultureContext?.clear();
          } else {
            openCulturePicker();
          }
        });

        cultureLensFab.addEventListener("pointercancel", clearPressTimer);
        cultureLensFab.addEventListener("pointerleave", (event) => {
          if (event.pointerType === "mouse") clearPressTimer();
        });
        cultureLensFab.addEventListener("click", (event) => {
          event.preventDefault();
        });
        cultureLensFab.addEventListener("contextmenu", (event) => {
          event.preventDefault();
        });
      }
      culturePicker
        .querySelectorAll("[data-close-culture]")
        .forEach((button) =>
          button.addEventListener("click", closeCulturePicker),
        );
      // Typing filters only — it can never activate a lens.
      culturePickerSearch?.addEventListener("input", (event) => {
        if (event.isComposing) return;
        if (cultureFilterFrame) return;
        cultureFilterFrame = requestAnimationFrame(() =>
          renderCulturePicker(),
        );
      });
      culturePickerSearch?.addEventListener("keydown", (event) => {
        if (event.isComposing) return;
        if (event.key === "ArrowDown") {
          event.preventDefault();
          moveCultureHighlight("down");
        } else if (event.key === "ArrowUp") {
          event.preventDefault();
          moveCultureHighlight("up");
        } else if (event.key === "Enter") {
          event.preventDefault();
          const slug =
            cultureHighlightedSlug ||
            cultureCountryList.querySelector("[data-culture]")?.dataset
              ?.culture ||
            "";
          applyCultureCountry(slug);
        }
      });
      // One tap → exactly one activation. Tapping the active country keeps
      // the lens (never toggles it off); the footer button turns it off.
      cultureCountryList?.addEventListener("click", (event) => {
        const option = event.target.closest("[data-culture]");
        if (!option) return;
        applyCultureCountry(option.dataset.culture || "");
      });
      document.addEventListener("keydown", (event) => {
        if (
          event.key === "Escape" &&
          culturePicker.classList.contains("is-open")
        )
          closeCulturePicker();
      });
      cultureClear.addEventListener("click", () => {
        cultureContext?.clear();
        closeCulturePicker();
      });
      window.addEventListener("echoo:culture-changed", () => {
        applyCultureMood();
        search(activeQuery, { contextChanged: true });
      });
      document
        .getElementById("discover-refresh")
        .addEventListener("click", () =>
          search(activeQuery, { refresh: true }),
        );

      locationMunicipality.innerHTML =
        window.EchooLocationPlatform.SUPPORTED_CITIES.map(
          (municipality) =>
            `<option value="${esc(municipality.name)}">${esc(municipality.name)}</option>`,
        ).join("");
      locationMunicipality.value = city;
      locationPill.addEventListener("click", (event) => {
        event.stopPropagation();
        toggleLocationSheet();
      });
      // Instant apply — no extra confirm button.
      locationMunicipality.addEventListener("change", () => {
        applyMunicipality(locationMunicipality.value);
      });
      locationSheet.addEventListener("click", (event) => {
        event.stopPropagation();
      });
      locationSheet.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          event.preventDefault();
          closeLocationSheet();
        }
      });
      document.addEventListener("click", (event) => {
        if (locationSheet?.hidden) return;
        if (locationSheet.contains(event.target)) return;
        if (locationPill?.contains(event.target)) return;
        closeLocationSheet();
      });
      useLocationButton?.addEventListener("click", () =>
        applyCurrentLocation(),
      );

      window.echooAccessReady.then(async (access) => {
        if (!access?.ok) return;
        await preflightStoredDeviceLocation();
        applyCultureMood();
        updateLocationBadge();
        items = [];
        nearbyItems = [];
        recommendedItems = [];
        renderDiscoverLoading();
        if (surpriseMode) {
          surpriseLoader.hidden = false;
          surpriseLoader.dataset.startedAt = String(Date.now());
          await Promise.race([
            hydrateOnboardingSignals({ refresh: false }),
            new Promise((resolve) => setTimeout(resolve, 850)),
          ]);
          if (
            !(Number.isFinite(lat) && Number.isFinite(lng)) &&
            prefs.locationPermissionState === "granted"
          ) {
            await refreshGrantedDeviceLocation({
              timeoutMs: 2500,
              refreshResults: false,
            });
          }
          search(activeQuery, { surprise: true });
        } else {
          search(activeQuery);
          hydrateOnboardingSignals();
          setTimeout(refreshGrantedDeviceLocation, 150);
        }
        if (params.get("culturePicker") === "1")
          setTimeout(openCulturePicker, 180);
        const deepPlace = params.get("place");
        if (deepPlace) {
          setTimeout(() => {
            openDetailByItem({
              id: deepPlace,
              canonicalId: deepPlace,
              title: params.get("name") || "Place",
            });
          }, 320);
        }
      });
      window.addEventListener("pagehide", persistCurrentSurface);
      document
        .querySelector('.bottom-nav a[aria-current="page"]')
        ?.addEventListener("click", (event) => event.preventDefault());
    </script>
    <script src="assets/page-loader.js"></script>
  </body>
</html>
