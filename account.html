<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <title>Echoo · Account &amp; Settings</title>
  <script>
    document.documentElement.classList.add("echoo-page-loading");
  </script>
  <style>
    :root {
      --bg-black: #050505;
      --ink: #f8f5ef;
      --muted: #9e978e;
      --peach: #f7d5b2;
      --card-radius: 20px;
      --pill-radius: 9999px;
      --line: rgba(248, 245, 239, 0.08);
      --line-strong: rgba(248, 245, 239, 0.16);
      --surface-dark: #121212;
      --surface-glass: rgba(22, 22, 22, 0.72);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg-black);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .app-shell {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding-bottom: 96px;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 20px 10px;
    }
    .topbar .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: var(--muted);
      padding: 8px 12px;
      border: 1px solid var(--line-strong);
      border-radius: var(--pill-radius);
      background: var(--surface-glass);
      transition: border-color 0.2s, color 0.2s;
    }
    .topbar .back:hover { color: var(--ink); border-color: var(--muted); }
    .topbar .back svg { width: 16px; height: 16px; }
    .topbar h1 { font-size: 20px; font-weight: 650; letter-spacing: -0.02em; }
    main { padding: 8px 20px 0; flex: 1; }
    .account-hero {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px;
      background: var(--surface-glass);
      border: 1px solid var(--line-strong);
      border-radius: var(--card-radius);
      margin-bottom: 24px;
    }
    .account-hero .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--peach), #c98a5e);
      color: #1a120a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      flex-shrink: 0;
      text-transform: uppercase;
    }
    .account-hero .who { min-width: 0; }
    .account-hero .who h2 {
      font-size: 18px;
      font-weight: 650;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .account-hero .who p {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .settings-section { margin-bottom: 24px; }
    .settings-section h3 {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      padding-left: 4px;
    }
    .settings-card {
      background: var(--surface-glass);
      border: 1px solid var(--line-strong);
      border-radius: var(--card-radius);
      overflow: hidden;
    }
    .settings-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 18px;
      border-bottom: 1px solid var(--line);
      transition: background 0.2s;
    }
    .settings-row:last-child { border-bottom: none; }
    a.settings-row:hover { background: rgba(248, 245, 239, 0.04); }
    .settings-row .icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: rgba(247, 213, 178, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .settings-row .icon svg { width: 18px; height: 18px; stroke: var(--peach); }
    .settings-row .label { flex: 1; min-width: 0; }
    .settings-row .label strong {
      display: block;
      font-size: 15px;
      font-weight: 550;
    }
    .settings-row .label span {
      display: block;
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .settings-row .chev { color: var(--muted); }
    .settings-row .chev svg { width: 16px; height: 16px; display: block; }
    .signout-row { color: #ff8f8f; cursor: pointer; border-bottom: none; }
    .signout-row .icon { background: rgba(255, 143, 143, 0.1); }
    .signout-row .icon svg { stroke: #ff8f8f; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 22px;
      border-radius: var(--pill-radius);
      font-size: 15px;
      font-weight: 600;
      border: 1px solid var(--line-strong);
      background: var(--surface-glass);
      color: var(--ink);
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn--peach { background: var(--peach); color: #1a120a; border-color: transparent; }
    .signin-cta {
      text-align: center;
      padding: 36px 24px;
      background: var(--surface-glass);
      border: 1px solid var(--line-strong);
      border-radius: var(--card-radius);
    }
    .signin-cta .sparkle { width: 44px; height: 44px; margin: 0 auto 14px; color: var(--peach); }
    .signin-cta h2 { font-size: 18px; font-weight: 650; margin-bottom: 6px; }
    .signin-cta p { color: var(--muted); font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
    .bottom-nav {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: min(100% - 32px, 430px);
      background: var(--surface-glass);
      border: 1px solid var(--line-strong);
      border-radius: var(--pill-radius);
      display: flex;
      padding: 6px;
      gap: 4px;
      z-index: 50;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .nav-link {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 8px 4px;
      border-radius: var(--pill-radius);
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 550;
      transition: color 0.2s, background 0.2s;
    }
    .nav-link svg { width: 20px; height: 20px; }
    .nav-link.active { color: var(--ink); background: rgba(248, 245, 239, 0.08); }
    .skeleton {
      border-radius: var(--card-radius);
      background: rgba(248, 245, 239, 0.06);
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    .skeleton-hero { height: 96px; margin-bottom: 24px; }
    .skeleton-block { height: 168px; margin-bottom: 24px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar" aria-label="Account and settings">
      <a class="back" href="index.html" aria-label="Back to home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5" /><path d="m12 19-7-7 7-7" />
        </svg>
        Home
      </a>
    </header>

    <main id="account-root" aria-live="polite">
      <div class="skeleton skeleton-hero"></div>
      <div class="skeleton skeleton-block"></div>
      <div class="skeleton skeleton-block"></div>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <a class="nav-link" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 11.5 12 4l9 7.5V21h-6v-6H9v6H3Z" />
        </svg>
        <span>Home</span>
      </a>
      <a class="nav-link" href="events.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" /><path d="m16 16 4 4" />
        </svg>
        <span>Discover</span>
      </a>
      <a class="nav-link" href="linkup.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" /><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
        </svg>
        <span>Link Up</span>
      </a>
      <a class="nav-link active" href="account.html" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" />
        </svg>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/echoo-auth.js"></script>
  <script>
    (async () => {
      const root = document.getElementById("account-root");
      const echooAuth = window.EchooAuth;

      const linkRow = (href, icon, label, detail) => `
        <a class="settings-row" href="${href}">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icon}</svg></span>
          <span class="label"><strong>${label}</strong>${detail ? `<span>${detail}</span>` : ""}</span>
          <span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg></span>
        </a>`;

      let state = null;
      try {
        state = await echooAuth?.loadOnboardingProfile?.();
      } catch (err) {
        state = null;
      }

      const user = state && state.ok ? state.user : null;

      if (!user) {
        root.innerHTML = `
          <section class="signin-cta">
            <svg class="sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18" />
            </svg>
            <h2>Welcome back</h2>
            <p>Sign in to manage your profile, culture lens, plan, and preferences.</p>
            <a class="btn btn--peach" href="auth.html?next=account.html&mode=signin">Sign in or create account</a>
          </section>`;
        return;
      }

      const name = user.user_metadata?.name || user.email?.split("@")[0] || "Echoo explorer";
      const initial = (name.trim()[0] || "E").toUpperCase();
      const city = state.profile?.city || "";

      root.innerHTML = `
        <section class="account-hero">
          <span class="avatar" aria-hidden="true">${initial}</span>
          <span class="who">
            <h2>${name}</h2>
            <p>${user.email || "Email not set"}</p>
          </span>
        </section>

        <section class="settings-section" aria-label="Preferences">
          <h3>Preferences</h3>
          <div class="settings-card">
            ${linkRow("culture.html", '<path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1Z" />', "Culture Lens", city ? `Set to ${city}` : "Choose your city vibe")}
            ${linkRow("linkup-settings.html", '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" /><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />', "Link Up", city ? `Matches in ${city}` : "Match preferences")}
          </div>
        </section>

        <section class="settings-section" aria-label="Plan">
          <h3>Plan</h3>
          <div class="settings-card">
            ${linkRow("happenings.html", '<path d="M8 2v4M16 2v4M3 9h18M5 5h14a2 2 0 0 1 2 2v13H3V7a2 2 0 0 1 2-2Z" /><path d="M8 13h8M8 17h5" />', "Events", "Happening near you")}
            ${linkRow("tickets.html", '<path d="M4 8V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" /><path d="M4 12h.01M16 12h4M20 12a2 2 0 0 1-2 2v0a2 2 0 0 1-2-2v0a2 2 0 0 1 2-2v0a2 2 0 0 1 2 2Z" />', "Tickets", "Your passes")}
          </div>
        </section>

        <section class="settings-section" aria-label="Account">
          <h3>Account</h3>
          <div class="settings-card">
            <div class="settings-row">
              <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="m3 7 9 6 9-6" /></svg></span>
              <span class="label"><strong>Email</strong><span>${user.email || "Not set"}</span></span>
            </div>
            <div class="settings-row">
              <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-5.1-7-11a7 7 0 0 1 14 0c0 5.9-7 11-7 11Z" /><circle cx="12" cy="10" r="2.5" /></svg></span>
              <span class="label"><strong>City</strong><span>${city || "Not set"}</span></span>
            </div>
            <button class="settings-row signout-row" id="signout-btn" type="button">
              <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" /></svg></span>
              <span class="label"><strong>Sign out</strong><span>End this session</span></span>
            </button>
          </div>
        </section>`;

      const signOutBtn = document.getElementById("signout-btn");
      if (signOutBtn) {
        signOutBtn.addEventListener("click", async () => {
          try {
            await echooAuth?.signOut?.();
          } catch (err) {}
          window.location.href = "auth.html?next=account.html&mode=signin";
        });
      }
    })();
  </script>
</body>
</html>
