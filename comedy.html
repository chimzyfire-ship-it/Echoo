<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>echoo comedy</title>
    <link rel="stylesheet" href="assets/lifestyle-live.css" />
    <link rel="stylesheet" href="assets/echoo-linkup.css" />
    <link rel="stylesheet" href="assets/page-loader.css" />
    <script>document.documentElement.classList.add("echoo-page-loading");</script>
  </head>
  <body
    data-page="comedy"
    data-query="comedy clubs standup live shows improvisational comedy Ontario"
  >
    <div class="app-shell">
      <header class="topbar" aria-label="Echoo">
        <a class="brand" href="index.html" aria-label="Echoo home">
          <img src="assets/echoo-wordmark.png" alt="echoo" />
        </a>
        <a class="profile-link" href="auth.html" aria-label="Open your profile"></a>
      </header>

      <main>
        <section class="hero" data-echoo-hero="comedy">
          <h1 data-echoo-hero-title>Laughter, curated live.</h1>
          <p data-echoo-hero-copy>
            Standup clubs, intimate comedy rooms, and headliners making tonight memorable.
          </p>
          <div class="live-state" id="live-state">Finding live Ontario picks...</div>
        </section>

        <div class="live-feed" id="live-feed" aria-live="polite"></div>
      </main>

      <!-- Culture Lens Floating Action Button -->
      <a class="fab-culture-lens" href="events.html?culturePicker=1" id="culture-lens-fab" aria-label="Culture Lens">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="7.5" cy="12" r="4.5" />
          <circle cx="16.5" cy="12" r="4.5" />
          <path d="M12 10.5v3" />
          <path d="M3 12h.5" />
          <path d="M20.5 12h.5" />
        </svg>
      </a>

      <!-- Floating Bottom Navigation with Discover Active -->
      <nav class="bottom-nav" aria-label="Main navigation">
        <a class="nav-link" href="index.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5V21h-6v-6H9v6H3Z" /></svg>
          <span>Home</span>
        </a>
        <a class="nav-link active" href="events.html" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m16 16 4 4" /></svg>
          <span>Discover</span>
        </a>
        <a class="nav-link" href="linkup.html">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
          </svg>
          <span>Link Up</span>
        </a>
        <a class="nav-link" href="auth.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></svg>
          <span>Profile</span>
        </a>
      </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/echoo-auth.js"></script>
    <script src="assets/culture-context.js"></script>
    <script src="assets/hero-copy.js"></script>
    <script src="assets/lifestyle-live.js"></script>
    <script src="assets/page-loader.js"></script>
  </body>
</html>
